<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peoples — Ae'Uuvoria</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ═════════════════════════════════════════════════════
       PEOPLES GALLERY — styles used only on this page
       (same card style as the Key Figures gallery)
    ═════════════════════════════════════════════════════ */
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
    .section-label { margin: 4rem 0 1.6rem; }

    .peoples-hero { padding: 120px 1.5rem 1rem; text-align: center; }
    .peoples-hero .kicker {
      font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
      color: #c8b882; margin-bottom: 0.8rem;
    }
    .peoples-hero h1 {
      font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 400;
      letter-spacing: 0.14em; text-transform: uppercase; line-height: 1;
      margin-bottom: 1.2rem;
    }
    .peoples-hero p {
      max-width: 580px; margin: 0 auto;
      font-size: 15.5px; line-height: 1.8; color: #9a8f7a; font-style: italic;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 230px));
      justify-content: center;
      gap: 1.2rem;
    }
    .card {
      --accent: #c8b882;
      position: relative;
      display: block;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      text-decoration: none;
      border: 0.5px solid #2a2420;
      background:
        radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 65%),
        #0e0e10;
      transition: border-color 0.25s;
    }
    .card img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1);
    }
    .card::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(10,10,10,0.94) 85%);
    }
    .card .initials {
      position: absolute; inset: 0 0 30% 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 54px; letter-spacing: 0.08em; color: rgba(232, 224, 208, 0.08);
    }
    .card-text {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      padding: 1.1rem 1.1rem 1.2rem; text-align: center;
    }
    .card-name { font-size: 17px; letter-spacing: 0.14em; text-transform: uppercase; color: #e8e0d0; }
    .card-sub { font-size: 12px; font-style: italic; line-height: 1.5; color: #9a8f7a; margin-top: 0.35rem; }
    .card-soon {
      font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
      color: #4a4440; margin-top: 0.5rem;
    }
    .card:hover { border-color: var(--accent); }
    .card:hover img { transform: scale(1.04); }
    .card.soon { cursor: default; }
    .card.soon:hover { border-color: #2a2420; }
    .card.soon .card-name { color: #9a8f7a; }

    footer { margin-top: 5rem; }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       NAV

  <header class="peoples-hero">
    <div class="kicker">species of the system</div>
    <h1>Peoples</h1>
    <p>From the ancients who came first to the peoples of Oa'Veyra today, and the life beyond it on Ia'Vorien and Iu'Miruun.</p>
  </header>

  <div class="wrap" id="groups"></div>

  <footer>
    <p>Ae'Uuvoria &mdash; A worldbuilding project by <a href="about-me.html">Nicole</a></p>
  </footer>

  <script>
    // ═══════════════════════════════════════════════════════════
    //  PEOPLES — grouped into sections. One line per species.
    //    name   — the species
    //    sub    — one short line under the name
    //    href   — its page ("" = no page yet, shows "Page coming soon")
    //    img    — art, tall works best (3:4). "" = none yet
    //    accent — its color
    //  To start a new group, copy a whole { label: ..., items: [...] } block.
    // ═══════════════════════════════════════════════════════════
    const GROUPS = [
      {
        label: "The ancients",
        items: [
          { name: "Au'Uuvori", sub: "The first-born divine light", href: "au-uuvori.html", img: "images/au-uuvori.jpg", accent: "#c8b882" },
        ]
      },
      {
        label: "Oa'Veyra · Western continent",
        items: [
          { name: "Makk'ar",   sub: "Four-eyed forest dwellers of the north-west", href: "", img: "", accent: "#97c355" },
          { name: "Fulgari",   sub: "Eight-legged glassworkers of the western desert", href: "", img: "", accent: "#f0c75c" },
          { name: "Isikitem",  sub: "Tusked farmers who worship the sister moons", href: "", img: "", accent: "#5da8dc" },
          { name: "The Grove", sub: "One forest, one organism", href: "", img: "", accent: "#e3973b" },
        ]
      },
      {
        label: "Oa'Veyra · Eastern continent",
        items: [
          { name: "Bovidians", sub: "Horned stone carvers of the eastern peaks", href: "", img: "", accent: "#c8b882" },
          { name: "Ilsaru",    sub: "Color-shifting stained glass priests", href: "", img: "", accent: "#d9579a" },
          { name: "Tassik",    sub: "Gliding cliff dwellers of the canyons", href: "", img: "", accent: "#e3973b" },
        ]
      },
      {
        label: "Oa'Veyra · Southern continent",
        items: [
          { name: "Ruefliti",  sub: "Amphibious diviners of reflections", href: "", img: "", accent: "#5da8dc" },
          { name: "Ventlings", sub: "Bismuth-shelled snails of the volcanic south", href: "", img: "", accent: "#a479f5" },
        ]
      },
		{
        label: "Ia'Vorien",
        items: [
          { name: "TBD", sub: "Silicon-based life of the Light world", href: "", img: "", accent: "#f0c75c" },
        ]
      },
      {
        label: "Iu'Miruun",
        items: [
          { name: "TBD", sub: "Life of the endless ocean", href: "", img: "", accent: "#5da8dc" },
        ]
      },
    ];

    // ═══════════════════════════════════════════════════════════
    //  ENGINE — no need to edit below this line
    // ═══════════════════════════════════════════════════════════
    const initials = n => n.replace(/^The /, "").replace(/['’]/g, "").slice(0, 2).toUpperCase();

    document.getElementById("groups").innerHTML = GROUPS.map(g => `
      <div class="section-label">${g.label}</div>
      <div class="grid">
        ${g.items.map(p => `
          <a class="card${p.href ? "" : " soon"}"${p.href ? ` href="${p.href}"` : ""} style="--accent:${p.accent || "#c8b882"}">
            <div class="initials">${initials(p.name)}</div>
            ${p.img ? `<img src="${p.img}" alt="" onerror="this.remove()">` : ""}
            <div class="card-text">
              <div class="card-name">${p.name}</div>
              <div class="card-sub">${p.sub}</div>
              ${p.href ? "" : `<div class="card-soon">Page coming soon</div>`}
            </div>
          </a>`).join("")}
      </div>`).join("");
  </script>

</body>
