<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Key Figures — Ae'Uuvoria</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ═════════════════════════════════════════════════════
       KEY FIGURES GALLERY — styles used only on this page
    ═════════════════════════════════════════════════════ */
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }

    .figures-hero { padding: 120px 1.5rem 3rem; text-align: center; }
    .figures-hero .kicker {
      font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
      color: #c8b882; margin-bottom: 0.8rem;
    }
    .figures-hero h1 {
      font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 400;
      letter-spacing: 0.14em; text-transform: uppercase; line-height: 1;
      margin-bottom: 1.2rem;
    }
    .figures-hero p {
      max-width: 560px; margin: 0 auto;
      font-size: 15.5px; line-height: 1.8; color: #9a8f7a; font-style: italic;
    }

    /* ─── The grid of cards ───────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 250px));
      justify-content: center;
      gap: 1.2rem;
    }
    .card {
      --accent: #c8b882;
      position: relative;
      display: block;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      text-decoration: none;
      border: 0.5px solid #2a2420;
      background:
        radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 65%),
        #0e0e10;
      transition: border-color 0.25s;
    }
    .card img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1);
    }
    .card img.contain { object-fit: contain; padding: 18% 14% 38%; }
    .card::after {           /* the fade behind the name */
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 45%, rgba(10,10,10,0.92) 85%);
    }
    .card-text {
      position: absolute; left: 0; right: 0; bottom: 0;
      z-index: 2;
      padding: 1.2rem 1.2rem 1.3rem;
      text-align: center;
    }
    .card-title {
      font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 0.35rem;
    }
    .card-name {
      font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase;
      color: #e8e0d0;
    }
    .card:hover { border-color: var(--accent); }
    .card:hover img { transform: scale(1.04); }
    .card.soon { pointer-events: none; }
    .card.soon .card-name { color: #7a7060; }
    .card .glyph {             /* shown when there's no art yet */
      position: absolute; inset: 0 0 25% 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.5;
    }

    footer { margin-top: 5rem; }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       NAV
  ════════════════════════════════════════════════════════ -->
  <nav>
    <a class="nav-logo" href="index.html">
      <svg width="20" height="20" viewBox="0 0 40 40" fill="none" stroke="#c8b882" stroke-width="1.6" stroke-linejoin="round">
        <polygon points="20,3 34.72,11.5 34.72,28.5 20,37 5.28,28.5 5.28,11.5"/>
        <path d="M20,3 V37 M20,3 L5.28,28.5 M20,3 L34.72,28.5 M20,37 L5.28,11.5 M20,37 L34.72,11.5 M5.28,11.5 H34.72 M5.28,28.5 H34.72 M5.28,11.5 L34.72,28.5 M34.72,11.5 L5.28,28.5"/>
      </svg>
      Ae'Uuvoria
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="planets.html">Planets</a></li>
      <li><a href="peoples.html">Peoples</a></li>
      <li><a href="figures.html" class="current">Figures</a></li>
      <li><a href="magic.html">Magic</a></li>
      <li><a href="#">History</a></li>
      <li><a href="a-to-z.html">Index</a></li>
    </ul>
  </nav>

  <header class="figures-hero">
    <div class="kicker">The people who shaped the world</div>
    <h1>Key Figures</h1>
    <p>Architects, ancients, and the people of Oa'Veyra today. Select a figure to read their story.</p>
  </header>

  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>

  <footer>
    <p>Ae'Uuvoria &mdash; A worldbuilding project by <a href="about-me.html">Nicole</a></p>
  </footer>

  <script>
    // ═══════════════════════════════════════════════════════════
    //  FIGURES — one line per character card.
    //    name    — their name
    //    title   — the small line above the name ("The Librarian")
    //    href    — their page ("" = no page yet, the card is dimmed)
    //    img     — portrait art, tall works best (3:4). "" = none yet
    //    contain — true for art that shouldn't be cropped (like the star)
    //    accent  — their color (same as --accent on their page)
    // ═══════════════════════════════════════════════════════════
    const FIGURES = [
      { name: "Eo'Sevoria", title: "The Librarian", href: "", img: "images/eo-sevoria.jpg", accent: "#c8b882" },
      { name: "Ae'Uuvoria", title: "The Δ Architect", href: "ae-uuvoria.html", img: "svgs/star.svg", contain: true, accent: "#9fc0ff" },
    ];

    // ═══════════════════════════════════════════════════════════
    //  ENGINE — no need to edit below this line
    // ═══════════════════════════════════════════════════════════
    const CORE = `<svg width="64" height="64" viewBox="0 0 22 22" fill="none" stroke="#c8b882" stroke-width="0.6"><polygon points="6.5,3.2 15.5,3.2 20,11 15.5,18.8 6.5,18.8 2,11"/><circle cx="11" cy="11" r="1.6" fill="#c8b882"/></svg>`;

    document.getElementById("grid").innerHTML = FIGURES.map(f => {
      const art = f.img
        ? `<div class="glyph">${CORE}</div><img src="${f.img}" alt=""${f.contain ? ' class="contain"' : ""} onload="this.previousElementSibling.remove()" onerror="this.remove()">`
        : `<div class="glyph">${CORE}</div>`;
      return `<a class="card${f.href ? "" : " soon"}" href="${f.href || "#"}" style="--accent:${f.accent || "#c8b882"}">
        ${art}
        <div class="card-text">
          <div class="card-title">${f.title}</div>
          <div class="card-name">${f.name}</div>
        </div>
      </a>`;
    }).join("");
  </script>

</body>
</html>
