<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Index — Ae'Uuvoria</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ═════════════════════════════════════════════════════
       INDEX PAGE — styles used only on this page
    ═════════════════════════════════════════════════════ */
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; }

    /* ─── Header + search ─────────────────────────────────── */
    .index-hero { padding: 120px 1.5rem 0; text-align: center; }
    .index-hero .kicker {
      font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
      color: #c8b882; margin-bottom: 0.8rem;
    }
    .index-hero h1 {
      font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 400;
      letter-spacing: 0.14em; text-transform: uppercase; line-height: 1;
      margin-bottom: 2.2rem;
    }
    .search {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
    }
    .search svg {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      pointer-events: none;
    }
    .search input {
      width: 100%;
      background: #0e0e0e;
      border: 0.5px solid #3a3430;
      color: #e8e0d0;
      font-family: inherit;
      font-size: 16px;
      letter-spacing: 0.04em;
      padding: 0.95rem 1rem 0.95rem 3rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search input::placeholder { color: #4a4440; font-style: italic; }
    .search input:focus { border-color: #c8b882; }
    .search input::-webkit-search-cancel-button { -webkit-appearance: none; }   /* hide the browser's blue × */

    /* ─── Category chips ──────────────────────────────────── */
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.45rem; margin: 1.4rem 0 0; }
    .chip {
      background: none; border: 0.5px solid #3a3430; color: #7a7060;
      font-family: inherit; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      padding: 0.5rem 0.9rem; cursor: pointer; transition: color 0.2s, border-color 0.2s;
    }
    .chip:hover { color: #c8b882; }
    .chip.active { color: #c8b882; border-color: #c8b882; }
    .chip .n { color: #4a4440; margin-left: 0.35rem; }

    /* ─── A–Z jump bar ────────────────────────────────────── */
    .letters {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0.15rem 0.2rem;
      margin: 2.2rem 0 0.5rem; padding: 0.8rem 0;
      border-top: 0.5px solid #2a2420; border-bottom: 0.5px solid #2a2420;
    }
    .letters a, .letters span {
      width: 1.7rem; text-align: center; font-size: 12px; letter-spacing: 0.08em;
      text-decoration: none; padding: 0.2rem 0;
    }
    .letters a { color: #c8b882; }
    .letters a:hover { color: #f4ecdc; }
    .letters span { color: #2a2420; }

    .count { text-align: center; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #4a4440; margin: 1rem 0 0; }

    /* ─── The list ────────────────────────────────────────── */
    .group { margin-top: 2.4rem; scroll-margin-top: 80px; }
    .group-letter {
      font-size: 28px; color: #c8b882; letter-spacing: 0.1em;
      border-bottom: 0.5px solid #2a2420; padding-bottom: 0.4rem; margin-bottom: 0.4rem;
    }
    .entry {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.3rem 1.5rem;
      align-items: baseline;
      padding: 0.85rem 0.6rem;
      border-bottom: 0.5px solid #1a1814;
      text-decoration: none;
      transition: background 0.2s;
    }
    a.entry:hover { background: rgba(200, 184, 130, 0.05); }
    a.entry:hover .entry-name { color: #c8b882; }
    .entry-name { font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: #e8e0d0; transition: color 0.2s; }
    .entry-name mark { background: none; color: #c8b882; }
    .entry-type { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #7a7060; text-align: right; white-space: nowrap; }
    .entry-desc { grid-column: 1 / -1; font-size: 13.5px; line-height: 1.6; color: #9a8f7a; }
    .entry-desc mark { background: none; color: #e8e0d0; }
    .entry.nolink .entry-name { color: #9a8f7a; }

    .empty { text-align: center; font-style: italic; color: #7a7060; margin: 3rem 0; }

    footer { margin-top: 5rem; }

    @media (max-width: 600px) {
      .entry { grid-template-columns: 1fr; }
      .entry-type { text-align: left; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       NAV
  ════════════════════════════════════════════════════════ -->
  <nav>
    <a class="nav-logo" href="index.html">
      <svg width="20" height="20" viewBox="0 0 40 40" fill="none" stroke="#c8b882" stroke-width="1.6" stroke-linejoin="round">
        <polygon points="20,3 34.72,11.5 34.72,28.5 20,37 5.28,28.5 5.28,11.5"/>
        <path d="M20,3 V37 M20,3 L5.28,28.5 M20,3 L34.72,28.5 M20,37 L5.28,11.5 M20,37 L34.72,11.5 M5.28,11.5 H34.72 M5.28,28.5 H34.72 M5.28,11.5 L34.72,28.5 M34.72,11.5 L5.28,28.5"/>
      </svg>
      Ae'Uuvoria
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="planets.html">Planets</a></li>
      <li><a href="peoples.html">Peoples</a></li>
      <li><a href="figures.html">Figures</a></li>
      <li><a href="magic.html">Magic</a></li>
      <li><a href="#">History</a></li>
      <li><a href="a-to-z.html" class="current">Index</a></li>
    </ul>
  </nav>

  <header class="index-hero">
    <div class="kicker">Everything in the wiki</div>
    <h1>Index</h1>

    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#7a7060" stroke-width="1.3"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="15" y2="15"/></svg>
      <input id="q" type="search" placeholder="Search planets, peoples, magic…" autocomplete="off" aria-label="Search the wiki">
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="wrap">
    <div class="letters" id="letters" aria-label="Jump to letter"></div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>

  <footer>
    <p>Ae'Uuvoria &mdash; A worldbuilding project by <a href="about-me.html">Nicole</a></p>
  </footer>

  <script>
    // ═══════════════════════════════════════════════════════════
    //  ENTRIES — everything the Index lists and searches.
    //  To add one, copy a line and change it:
    //    name  — what it's called
    //    type  — its category (a new type makes a new filter chip)
    //    desc  — one short line
    //    href  — where it links ("" = no page yet, shows unlinked)
    //  The list sorts itself A–Z, so order here doesn't matter.
    // ═══════════════════════════════════════════════════════════
    const ENTRIES = [
      // ─── The star & planets ───
      { name: "Ae'Uuvoria",  type: "Star",   desc: "The blue-white star at the center of the system, and its creator.", href: "ae-uuvoria.html" },
      { name: "Au'Taelis",   type: "Planet", desc: "Planet I · Order. Small, airless and tidally locked.",               href: "au-taelis.html" },
      { name: "Ia'Vorien",   type: "Planet", desc: "Planet II · Light. Home of silicon-based life.",                     href: "ia-vorien.html" },
      { name: "Oa'Veyra",    type: "Planet", desc: "Planet III · Nature. The home world.",                               href: "oa-veyra.html" },
      { name: "Iu'Miruun",   type: "Planet", desc: "Planet IV · Water. A single global ocean.",                          href: "iu-miruun.html" },
      { name: "Ui'Zhaera",   type: "Planet", desc: "Planet V · Chaos. Green gas giant tipped on its side.",              href: "ui-zhaera.html" },
      { name: "Eu'Nyhl",     type: "Planet", desc: "Planet VI · Darkness. A dark wanderer on a 5,000-year orbit.",       href: "eu-nyhl.html" },
      { name: "The Six Worlds", type: "Planet", desc: "Overview of the whole system.",                                   href: "planets.html" },

      // ─── Moons ───
      { name: "Atathetem",   type: "Moon", desc: "Moon A of Oa'Veyra, the small volcanic “younger sister.”",             href: "oa-veyra.html" },
      { name: "Etathetem",   type: "Moon", desc: "Moon B of Oa'Veyra, the larger watery “older sister.”",                href: "oa-veyra.html" },
	  { name: "Moon 3",   	 type: "Moon", desc: "Moon of Iu'Miruun.”",             href: "oa-veyra.html" },

      // ─── Peoples ───
      { name: "Fulgari",     type: "People", desc: "Eight-legged glassworkers of the western desert.",   href: "index.html#species" },
      { name: "Makk'ar",     type: "People", desc: "Four-eyed forest dwellers of the north-west.",       href: "index.html#species" },
      { name: "Isikitem",    type: "People", desc: "Tusked farmers who worship the sister moons.",       href: "index.html#species" },
      { name: "Ruefliti",    type: "People", desc: "Amphibious diviners of reflections.",                href: "index.html#species" },
      { name: "Ventlings",   type: "People", desc: "Bismuth-shelled snails of the volcanic south.",      href: "index.html#species" },
      { name: "Bovidians",   type: "People", desc: "Horned stone carvers of the eastern peaks.",         href: "index.html#species" },
      { name: "Ilsaru",      type: "People", desc: "Color-shifting stained glass priests.",              href: "index.html#species" },
      { name: "Tassik",      type: "People", desc: "Gliding cliff dwellers of the canyons.",             href: "index.html#species" },
      { name: "Au'Uuvori",   type: "People", desc: "The ancients. Created beings who ruled the Era of Magic, now all but gone.", href: "au-uuvori.html" },
      { name: "Peoples", type: "People", desc: "Gallery of every species on Oa'Veyra.", href: "peoples.html" },

      // ─── Figures ───
      { name: "Eo'Sevoria",  type: "Figure", desc: "The Librarian. Last of the ancients, on the mountain that pierces the barrier.", href: "" },
      { name: "Key Figures", type: "Figure", desc: "Gallery of every character with a page.", href: "figures.html" },

      // ─── Magic: elements ───
      { name: "Core",        type: "Element", desc: "The foundation of magic, and the creator's place in it.",  href: "magic.html#el-core" },
      { name: "Order",       type: "Element", desc: "Major element. Brings things together.",                   href: "magic.html#el-order" },
      { name: "Light",       type: "Element", desc: "Major element. The one magic the barrier lets through.",   href: "magic.html#el-light" },
      { name: "Nature",      type: "Element", desc: "Major element.",                                           href: "magic.html#el-nature" },
      { name: "Water",       type: "Element", desc: "Major element.",                                           href: "magic.html#el-water" },
      { name: "Chaos",       type: "Element", desc: "Major element. Pushes things apart.",                      href: "magic.html#el-chaos" },
      { name: "Darkness",    type: "Element", desc: "Major element.",                                           href: "magic.html#el-darkness" },
      { name: "Cold",        type: "Element", desc: "Minor element, between Order and Water.",                  href: "magic.html#el-cold" },
      { name: "War",         type: "Element", desc: "Minor element, between Water and Darkness.",               href: "magic.html#el-war" },
      { name: "Death",       type: "Element", desc: "Minor element, between Darkness and Chaos.",               href: "magic.html#el-death" },
      { name: "Heat",        type: "Element", desc: "Minor element, between Chaos and Nature.",                 href: "magic.html#el-heat" },
      { name: "Love",        type: "Element", desc: "Minor element, between Nature and Light.",                 href: "magic.html#el-love" },
      { name: "Life",        type: "Element", desc: "Minor element, between Light and Order.",                  href: "magic.html#el-life" },

      // ─── Magic: everything else ───
      { name: "The Cost",            type: "Magic", desc: "Every use of magic takes a piece of the soul.",            href: "magic.html#cost" },
      { name: "Glyph Writing",       type: "Magic", desc: "One glyph per element, combined for the minors.",          href: "magic.html#writing" },
      { name: "Node Writing",        type: "Magic", desc: "Six connected nodes around the core.",                     href: "magic.html#writing" },
      { name: "Line Writing",        type: "Magic", desc: "The six-state script of the ancients' technology.",        href: "magic.html#writing" },
      { name: "Constellation Enchanting", type: "Magic", desc: "Marking objects with constellations to channel elements.", href: "magic.html#constellations" },
      { name: "Solar Refraction",    type: "Magic", desc: "Shaped glass that focuses light into beams.",              href: "magic.html#today" },
      { name: "Spectral Separation", type: "Magic", desc: "Stained glass and prisms that pick out elements.",         href: "magic.html#today" },
      { name: "Reflection Divination", type: "Magic", desc: "Reading truths, and not-quite-truths, in reflections.",  href: "magic.html#today" },
      { name: "Moon Divination",     type: "Magic", desc: "The Isikitem's moon-reading. Science, not magic.",         href: "magic.html#today" },
      { name: "The Barrier",         type: "Magic", desc: "The shimmer around Oa'Veyra that blocks almost all magic.", href: "oa-veyra.html" },

      // ─── History ───
      { name: "Era of Magic",    type: "Era", desc: "~20,700,000–16,700,000 SKM. The golden age.",                href: "magic.html#eras" },
      { name: "Era of Darkness", type: "Era", desc: "~16,700,000–16,699,950 SKM. The magical apocalypse.",        href: "magic.html#eras" },
      { name: "Era of Rebirth",  type: "Era", desc: "~16,699,950 SKM to now. Life after the barrier.",            href: "magic.html#eras" },

      // ─── Constellations ───
      { name: "The Wellspring", type: "Constellation", desc: "Water. A flask slowly refills itself from the air.",       href: "magic.html#constellations" },
      { name: "The Current",    type: "Constellation", desc: "Water. Always points toward running water.",               href: "magic.html#constellations" },
      { name: "The Veil",       type: "Constellation", desc: "Darkness. A cloak blurs into shadow.",                     href: "magic.html#constellations" },
      { name: "The Rebuke",     type: "Constellation", desc: "Chaos. A shield shoves back whatever strikes it.",         href: "magic.html#constellations" },
      { name: "The Split",      type: "Constellation", desc: "Chaos.",                                                   href: "magic.html#constellations" },
      { name: "The Root",       type: "Constellation", desc: "Nature. A stake or anchor never slips.",                   href: "magic.html#constellations" },
      { name: "The Bloom",      type: "Constellation", desc: "Nature. Growth is accelerated.",                           href: "magic.html#constellations" },
      { name: "The Lens",       type: "Constellation", desc: "Light. Strengthens any other enchantment on the object.",  href: "magic.html#constellations" },
      { name: "The Prism",      type: "Constellation", desc: "Light. Lets an object carry two enchantments safely.",     href: "magic.html#constellations" },
      { name: "The Beacon",     type: "Constellation", desc: "Light. Glass or a lantern glows on its own.",              href: "magic.html#constellations" },
      { name: "The Binding",    type: "Constellation", desc: "Order. Two enchanted pieces snap together and hold.",      href: "magic.html#constellations" },
      { name: "The Unbroken",   type: "Constellation", desc: "Order. An object can't break, bend, or dull.",             href: "magic.html#constellations" },
      { name: "The Measure",    type: "Constellation", desc: "Order.",                                                   href: "magic.html#constellations" },
      { name: "The Forge",      type: "Constellation", desc: "Heat. Makes a heat source.",                               href: "magic.html#constellations" },
      { name: "The Kindling",   type: "Constellation", desc: "Heat / Nature border. Gives an object the “flame” enchantment.", href: "magic.html#constellations" },
      { name: "The Frost",      type: "Constellation", desc: "Cold. Cools the area around it.",                          href: "magic.html#constellations" },
      { name: "The Chill",      type: "Constellation", desc: "Cold.",                                                    href: "magic.html#constellations" },
      { name: "The Evergreen",  type: "Constellation", desc: "Life. A plant or cut flower never wilts.",                 href: "magic.html#constellations" },
      { name: "The Graft",      type: "Constellation", desc: "Life.",                                                    href: "magic.html#constellations" },
      { name: "The Bond",       type: "Constellation", desc: "Love. Two paired objects feel warm when near each other.", href: "magic.html#constellations" },
      { name: "The Longing",    type: "Constellation", desc: "Love. Two halves of a broken object glow for each other.", href: "magic.html#constellations" },
      { name: "The Rally",      type: "Constellation", desc: "War. A banner steadies nearby allies against fear.",       href: "magic.html#constellations" },
      { name: "The Challenge",  type: "Constellation", desc: "War. Draws enemies' attention to whoever carries it.",     href: "magic.html#constellations" },
      { name: "The Wither",     type: "Constellation", desc: "Death. Wounds from an enchanted blade are slow to close.", href: "magic.html#constellations" },
      { name: "The Rot",        type: "Constellation", desc: "Death. Wood or metal it touches slowly decays.",           href: "magic.html#constellations" },
    ];

    // ═══════════════════════════════════════════════════════════
    //  ENGINE — no need to edit below this line
    // ═══════════════════════════════════════════════════════════
    const qInput  = document.getElementById("q");
    const listEl  = document.getElementById("list");
    const lettersEl = document.getElementById("letters");
    const countEl = document.getElementById("count");
    const chipsEl = document.getElementById("chips");
    let activeType = "All";

    // Sort ignoring "The " and apostrophes, so "The Bond" files under B
    const sortKey = e => e.name.replace(/^The /, "").replace(/['’]/g, "").toLowerCase();
    const letterOf = e => sortKey(e)[0].toUpperCase();
    ENTRIES.sort((a, b) => sortKey(a).localeCompare(sortKey(b)));

    // Category chips, built from whatever types exist
    const types = ["All", ...new Set(ENTRIES.map(e => e.type))];
    chipsEl.innerHTML = types.map(t => {
      const n = t === "All" ? ENTRIES.length : ENTRIES.filter(e => e.type === t).length;
      return `<button class="chip${t === "All" ? " active" : ""}" data-type="${t}">${t}<span class="n">${n}</span></button>`;
    }).join("");
    chipsEl.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
      activeType = chip.dataset.type;
      chipsEl.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === chip));
      render();
    }));

    // Search ignores capitals, apostrophes and accents: "eunyhl" finds Eu'Nyhl
    const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/['’]/g, "").toLowerCase();
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // Wrap the matching part of the text in <mark> (works across apostrophes)
    function highlight(text, q) {
      if (!q) return esc(text);
      const map = []; let folded = "";
      [...text].forEach((ch, i) => {
        const f = fold(ch);
        for (const c of f) { folded += c; map.push(i); }
      });
      const at = folded.indexOf(q);
      if (at < 0) return esc(text);
      const chars = [...text];
      const start = map[at], end = map[at + q.length - 1] + 1;
      return esc(chars.slice(0, start).join("")) + "<mark>" + esc(chars.slice(start, end).join("")) + "</mark>" + esc(chars.slice(end).join(""));
    }

    function render() {
      const q = fold(qInput.value.trim());
      const shown = ENTRIES.filter(e =>
        (activeType === "All" || e.type === activeType) &&
        (!q || fold(e.name + " " + e.desc + " " + e.type).includes(q)));

      // group by first letter
      const groups = {};
      shown.forEach(e => (groups[letterOf(e)] ||= []).push(e));

      listEl.innerHTML = shown.length ? Object.keys(groups).map(L => `
        <section class="group" id="letter-${L}">
          <div class="group-letter">${L}</div>
          ${groups[L].map(e => {
            const tag = e.href ? "a" : "div";
            const href = e.href ? ` href="${e.href}"` : "";
            return `<${tag} class="entry${e.href ? "" : " nolink"}"${href}>
              <span class="entry-name">${highlight(e.name, q)}</span>
              <span class="entry-type">${e.type}</span>
              <span class="entry-desc">${highlight(e.desc, q)}</span>
            </${tag}>`;
          }).join("")}
        </section>`).join("")
        : `<p class="empty">Nothing in the wiki matches &ldquo;${esc(qInput.value)}&rdquo; yet.</p>`;

      lettersEl.innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(L =>
        groups[L] ? `<a href="#letter-${L}">${L}</a>` : `<span>${L}</span>`).join("");

      countEl.textContent = `${shown.length} ${shown.length === 1 ? "entry" : "entries"}`;

      // keep the search in the address bar, so a search can be shared or bookmarked
      const url = new URL(location);
      if (qInput.value) url.searchParams.set("q", qInput.value); else url.searchParams.delete("q");
      history.replaceState(null, "", url);
    }

    // a-to-z.html?q=glass opens with "glass" already searched
    qInput.value = new URLSearchParams(location.search).get("q") || "";
    qInput.addEventListener("input", render);
    render();
  </script>

</body>
