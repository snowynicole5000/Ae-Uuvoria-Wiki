<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- soft outer glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#bcd6ff" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#7fa9f0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4a6fc0" stop-opacity="0"/>
    </radialGradient>
    <!-- the star itself: white-hot center, blue-white edge -->
    <radialGradient id="body" cx="42%" cy="40%" r="62%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#e6f0ff"/>
      <stop offset="80%"  stop-color="#a9c8ff"/>
      <stop offset="100%" stop-color="#6f9be8"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#glow)"/>
  <circle cx="100" cy="100" r="46" fill="url(#body)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
